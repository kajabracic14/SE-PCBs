<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Superior Engineering PCBs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F7F5; --sheet:#FFFFFF; --ink:#1B2330; --ink2:#5A6472; --line:#C9D0D9; --grid:#E4E8ED;
  --wire:#0B7A43; --wire-soft:#E1F0E7; --ok:#1E6E3C; --band:#0A5A33; --band-ink:#FFFFFF; --ok-soft:#E4F2E9; --err:#B3261E; --err-soft:#F8E5E3;
  --warn:#9A6200; --warn-soft:#F6EDDC;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-head:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161C; --sheet:#1A2029; --ink:#E6EAF0; --ink2:#9AA4B2; --line:#343D4A; --grid:#262D38;
    --wire:#5CCB8F; --wire-soft:#15301F; --ok:#7FD6A3; --band:#0C4A2B; --band-ink:#EAF6EF; --ok-soft:#18301F; --err:#F08C84; --err-soft:#3A1D1B;
    --warn:#E0B060; --warn-soft:#352A15;
  }
}
:root[data-theme="dark"]{
  --paper:#12161C; --sheet:#1A2029; --ink:#E6EAF0; --ink2:#9AA4B2; --line:#343D4A; --grid:#262D38;
  --wire:#5CCB8F; --wire-soft:#15301F; --ok:#7FD6A3; --band:#0C4A2B; --band-ink:#EAF6EF; --ok-soft:#18301F; --err:#F08C84; --err-soft:#3A1D1B;
  --warn:#E0B060; --warn-soft:#352A15;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; background:var(--paper); color:var(--ink); font:16px/1.5 var(--f-body); font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--wire)}
:focus-visible{outline:2px solid var(--wire); outline-offset:2px}
img{max-width:100%}

.app{display:grid; grid-template-columns:300px 1fr; height:100%}
aside{border-right:1px solid var(--line); background:var(--sheet); display:flex; flex-direction:column; min-height:0}
main{overflow:auto; min-width:0}

.brand{padding:16px 18px; background:var(--band); color:var(--band-ink); display:flex; align-items:center; gap:12px}
.brand .logo{width:48px; height:48px; flex:none; display:flex; align-items:center; justify-content:center; border:2px solid var(--band-ink); border-radius:50%; font:700 18px var(--f-head); overflow:hidden; background:transparent; color:inherit; padding:0}
.brand .logo.has{border:0; border-radius:0; background:none}
.brand .logo img{max-width:100%; max-height:100%; object-fit:contain; filter:brightness(0) invert(1)}
.brand h1{font:700 23px/1.05 var(--f-head); margin:0}
.brand p{margin:2px 0 0; font:600 18px/1 var(--f-head); opacity:.8}
.helpbtn{display:flex; align-items:center; gap:10px; width:calc(100% - 36px); margin:12px 18px 0; padding:10px 12px; border:1px solid var(--wire); background:var(--wire-soft); color:var(--ink); border-radius:4px; cursor:pointer; text-align:left}
.helpbtn b{font:700 16px var(--f-head); color:var(--wire)}
.helpbtn span{font-size:14px; color:var(--ink2)}
.help{width:min(680px,100%); max-height:85vh; overflow:auto}
.help details{border-top:1px solid var(--line); padding:8px 0}
.help details:last-of-type{border-bottom:1px solid var(--line)}
.help summary{cursor:pointer; font:600 18px var(--f-head); padding:4px 0}
.help details[open] summary{color:var(--wire)}
.help details p,.help details li{max-width:66ch}
.help ul{padding-left:20px; margin:6px 0}
.help .logo-set{margin-top:16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.search{padding:12px 18px; border-bottom:1px solid var(--line)}
.search input{width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:4px; background:var(--paper)}
.list{flex:1; overflow:auto; padding:6px 0}
.item{display:block; width:100%; text-align:left; border:0; background:none; padding:10px 18px; cursor:pointer; border-left:3px solid transparent}
.item:hover{background:var(--paper)}
.item[aria-current="true"]{border-left-color:var(--wire); background:var(--wire-soft)}
.item .row1{display:flex; align-items:baseline; gap:8px}
.item .kr{font:700 17px var(--f-head)}
.item .rv{color:var(--ink2); font-size:13px; margin-left:auto}
.item .nm{color:var(--ink2); font-size:14px}
.item .hit{font-size:13px; color:var(--wire); margin-top:2px}
.side-foot{border-top:1px solid var(--line); padding:12px 18px; display:flex; flex-wrap:wrap; gap:8px}

.btn{border:1px solid var(--line); background:var(--sheet); padding:7px 12px; border-radius:4px; cursor:pointer; font-weight:500}
.btn:hover{border-color:var(--ink2)}
.btn.primary{background:var(--wire); border-color:var(--wire); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0E1420}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0E1420}}
.btn.danger{color:var(--err); border-color:var(--err)}
.btn.small{padding:3px 8px; font-size:14px}
.btn[disabled]{opacity:.5; cursor:default}
.linkbtn{border:0; background:none; color:var(--wire); cursor:pointer; padding:0; font-weight:500}

.detail{max-width:1100px; margin:0 auto; padding:24px 28px 60px}
.topbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.topbar .spacer{flex:1}
.back{display:none}
.meta{color:var(--ink2); font-size:14px}

/* Title block – kot glava na listu sheme */
.tblock{display:grid; grid-template-columns:repeat(6,1fr); border:2px solid var(--ink); border-top:6px solid var(--wire); background:var(--sheet)}
.tb{border-right:1px solid var(--ink); border-bottom:1px solid var(--ink); padding:6px 10px 8px; min-width:0}
.tb label,.tb .lab{display:block; font-size:12px; color:var(--ink2); line-height:1.2; margin-bottom:2px}
.tb .val{font-weight:500; overflow-wrap:anywhere}
.tb.kr{grid-column:span 2; grid-row:span 2; display:flex; flex-direction:column; justify-content:flex-end}
.tb.kr .val{font:700 clamp(40px,7vw,64px)/.95 var(--f-head); letter-spacing:.01em}
.tb.kr .nm{font:600 18px var(--f-head); color:var(--ink2); margin-top:4px}
.tb.w2{grid-column:span 2}
.tb.w4{grid-column:span 4}
.tb.end{border-right:0}
.tblock .last{border-bottom:0}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin:26px 0 20px; overflow-x:auto}
.tab{border:0; background:none; padding:9px 12px; cursor:pointer; color:var(--ink2); font:600 16px var(--f-head); border-bottom:3px solid transparent; white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--wire)}

h2{font:700 21px/1.2 var(--f-head); margin:28px 0 10px}
h2:first-child{margin-top:0}
h3{font:600 18px/1.2 var(--f-head); margin:18px 0 8px}
.lead{max-width:72ch}
.muted{color:var(--ink2)}
.empty-val{color:var(--ink2); font-style:italic}

.fields{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px 20px}
.f label{display:block; font-size:13px; color:var(--ink2); margin-bottom:2px}
.f .val{white-space:pre-wrap}
.f.wide{grid-column:1/-1}
input.in,select.in,textarea.in{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:3px; background:var(--sheet)}
textarea.in{min-height:70px; resize:vertical}

.tw{overflow-x:auto; border:1px solid var(--line); background:var(--sheet)}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{border-bottom:1px solid var(--grid); padding:6px 10px; text-align:left; vertical-align:top}
th{font:600 14px var(--f-head); color:var(--ink2); background:var(--paper); white-space:nowrap}
tr:last-child td{border-bottom:0}
td input.in{min-width:80px; padding:4px 6px}
td.act{width:1%; white-space:nowrap}
.addrow{margin-top:8px}

.card{border:1px solid var(--line); background:var(--sheet); padding:14px 16px; margin-bottom:16px}
.card .hd{display:flex; align-items:baseline; gap:10px; margin-bottom:10px}
.card .hd .ref{font:700 22px var(--f-head); color:var(--wire)}
.card .hd .spacer{flex:1}

.chip{display:inline-block; font-size:13px; font-weight:600; padding:1px 8px; border-radius:10px; border:1px solid currentColor; white-space:nowrap}
.st-razvoj{color:var(--wire)} .st-izdelano{color:var(--ink2)} .st-testirano{color:var(--warn)} .st-avto{color:var(--ok)} .st-opusceno{color:var(--ink2); text-decoration:line-through}
.ok{color:var(--ok); font-weight:600} .nok{color:var(--err); font-weight:600}

.steps{counter-reset:s; list-style:none; padding:0; margin:0 0 8px; max-width:78ch}
.steps li{counter-increment:s; position:relative; padding:6px 0 6px 38px; border-bottom:1px dashed var(--grid)}
.steps li::before{content:counter(s); position:absolute; left:0; top:6px; width:26px; height:26px; border:2px solid var(--ink); border-radius:50%; text-align:center; font:700 14px/22px var(--f-head)}

.rev{border-left:3px solid var(--line); padding:4px 0 4px 16px; margin-bottom:22px}
.rev.current{border-left-color:var(--wire)}
.rev .rh{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.rev .rl{font:700 22px var(--f-head)}
.rev ul{margin:4px 0 8px; padding-left:20px}

.img-slot{border:1px dashed var(--line); padding:10px; background:var(--sheet)}
.img-slot img{display:block; max-height:420px; margin:0 auto}

.banner{padding:10px 14px; border:1px solid var(--warn); background:var(--warn-soft); color:var(--ink); margin-bottom:14px}
.banner.err{border-color:var(--err); background:var(--err-soft)}
.editbar{position:sticky; top:0; z-index:5; display:flex; gap:8px; align-items:center; padding:10px 0; background:var(--paper); border-bottom:1px solid var(--line); margin-bottom:14px}
.toast{position:fixed; bottom:calc(16px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); padding:8px 14px; border-radius:4px; font-size:15px}

.blank{max-width:520px; margin:12vh auto; padding:0 24px; text-align:left}
.blank h2{font-size:28px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .app.show-detail aside{display:none}
  .app:not(.show-detail) main{display:none}
  .back{display:inline-block}
  .detail{padding:16px 16px 60px}
  .tblock{grid-template-columns:repeat(2,1fr)}
  .tb.kr,.tb.w2,.tb.w4{grid-column:span 2}
  .tb{border-right:1px solid var(--ink)}
  .tb:nth-child(odd):not(.kr):not(.w2):not(.w4){border-right:1px solid var(--ink)}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.revstrip{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin:22px 0 0}
.rpill{border:1px solid var(--line); background:var(--sheet); padding:4px 12px; border-radius:14px; cursor:pointer; font:600 15px var(--f-head)}
.rpill[aria-current="true"]{background:var(--wire); color:var(--band-ink); border-color:var(--wire)}
.checklist{list-style:none; padding:0; margin:0 0 10px; max-width:820px}
.checklist li{display:grid; grid-template-columns:28px 1fr; gap:10px; padding:10px 0; border-bottom:1px dashed var(--grid)}
.checklist input[type=checkbox]{width:20px; height:20px; margin-top:3px; accent-color:var(--ok)}
.checklist li.done strong{color:var(--ok)}
.checklist .body{display:flex; flex-direction:column; gap:6px; min-width:0}
.checklist .row2{display:flex; gap:8px}
.checklist textarea.note{min-height:40px; font-size:15px}
.diff li{margin:2px 0}
.modal-back{position:fixed; inset:0; background:rgba(10,14,20,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50}
.modal{background:var(--sheet); border:2px solid var(--ink); padding:20px 22px; width:min(440px,100%)}
.modal h2{margin:0 0 8px}
.modal .mbtns{display:flex; justify-content:flex-end; gap:8px; margin-top:16px}
.modal .merr{color:var(--err); margin:6px 0 0}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand">
      <div><h1>Superior Engineering</h1><p>PCBs</p></div>
    </div>
    <button class="helpbtn" data-act="help"><b>Navodila</b><span>Kako dodati vezje, revizijo in testirati</span></button>
    <div class="search"><input id="q" type="search" placeholder="Išči po vseh vezjih (npr. 0x100, CAN_H, Micro-Fit)" aria-label="Iskanje"></div>
    <div class="list" id="list"></div>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main id="main"><div class="blank"><p class="muted">Nalagam vezja …</p></div></main>
</div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* =====================================================================
   PODATKOVNI SLOJ
   Edino mesto, ki ve, kje so podatki shranjeni. Pri selitvi na svoj
   strežnik (npr. Supabase) zamenjaš samo funkcije v objektu `store`.
   Podatki:  vezja/<id>     { kratica, ime, createdAt }
             revizije/<id>  { vezjeId, rev, created, status, datum, avtor,
                              spremembe, errata, data:{...}, updatedAt, updatedBy }
   ===================================================================== */
/* ---------- NASTAVITVE: vpiši podatke svojega Supabase projekta ---------- */
const SUPABASE_URL = "https://szvibldsdwkamcylrpmh.supabase.co";        // npr. https://abcdefgh.supabase.co
const SUPABASE_KEY = "sb_publishable_4MLc8XrztYlYu9UtorIqHg_R52YmtFq";    // anon / publishable key (je javen, varnost zagotavljajo pravila v bazi)

const store = {
  sb: null, email: null, member: null,
  async init() {
    if (!window.supabase || SUPABASE_URL.startsWith("VPISI")) { state.error = "Aplikacija še ni povezana s Supabase. V index.html vpiši SUPABASE_URL in SUPABASE_KEY."; return false; }
    this.sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const { data: { session } } = await this.sb.auth.getSession();
    if (!session) { renderLogin(); return "login"; }
    this.email = (session.user.email || "").toLowerCase();
    const { data } = await this.sb.from("clani").select("ime, lahko_ureja").eq("email", this.email).maybeSingle();
    if (!data) { state.error = `E-mail ${this.email} ni na seznamu članov. Prosi skrbnika aplikacije, da te doda, nato osveži stran.`; renderSideFoot(); return false; }
    this.member = data;
    return true;
  },
  subscribe(col, cb, onErr) {
    let t;
    const load = async () => {
      const { data, error } = await this.sb.from(col).select("id, data");
      if (error) return onErr(error);
      cb(data.map(r => ({ id: r.id, ...r.data })));
    };
    load();
    this.sb.channel("sprememba-" + col)
      .on("postgres_changes", { event: "*", schema: "public", table: col }, () => { clearTimeout(t); t = setTimeout(load, 300); })
      .subscribe();
  },
  watchSettings() {},
  newId() { return crypto.randomUUID(); },
  async save(col, id, doc) {
    const row = { id, data: doc, updated_at: new Date().toISOString() };
    if (col === "revizije") row.vezje_id = doc.vezjeId;
    const { error } = await this.sb.from(col).upsert(row);
    if (error) throw { code: error.code === "42501" ? "invalid_argument" : "unavailable", message: error.message };
  },
  async update(col, id, patch) {
    const curDoc = structuredClone((col === "revizije" ? state.revs : state.vezja).get(id) || {});
    const merge = (a, b) => { for (const k in b) { if (b[k] && typeof b[k] === "object" && !Array.isArray(b[k])) a[k] = merge(a[k] && typeof a[k] === "object" ? a[k] : {}, b[k]); else a[k] = b[k]; } return a; };
    await this.save(col, id, merge(curDoc, patch));
  },
  async remove(col, id) {
    const { error } = await this.sb.from(col).delete().eq("id", id);
    if (error) throw { code: "unavailable", message: error.message };
  },
  canUpload() { return !!(this.member && this.member.lahko_ureja); },
  async upload(blob) {
    if (blob.size > 20 * 1024 * 1024) throw { code: "too_large" };
    const ext = ({ "image/png": ".png", "image/jpeg": ".jpg", "image/webp": ".webp", "image/gif": ".gif" })[blob.type] || "";
    const path = crypto.randomUUID() + ext;
    const { error } = await this.sb.storage.from("slike").upload(path, blob, { contentType: blob.type });
    if (error) throw { code: "unavailable", message: error.message };
    return path;
  },
  imageUrl(id) { return this.sb.storage.from("slike").getPublicUrl(id).data.publicUrl; },
  async readImage(id) { const r = await fetch(this.imageUrl(id)); if (!r.ok) throw new Error(); return await r.blob(); },
  async myId() { return this.email; },
  async canWrite() { return !!(this.member && this.member.lahko_ureja); },
  async names(ids) {
    const { data } = await this.sb.from("clani").select("email, ime").in("email", ids);
    const out = {}; ids.forEach(i => out[i] = { name: i }); (data || []).forEach(r => { if (r.ime) out[r.email] = { name: r.ime }; });
    return out;
  },
  canDownload() { return true; },
  async download(filename, text) {
    const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  },
  canLogout() { return true; },
  logout() { return this.sb.auth.signOut(); },
};

function renderLogin() {
  $("#app").innerHTML = `<div class="blank" style="grid-column:1/-1">
    <h2>Superior Engineering PCBs</h2>
    <p>Vpiši svoj e-mail. Poslali ti bomo povezavo za prijavo, gesla ne potrebuješ.</p>
    <p><label for="lm" class="muted">E-mail</label><input class="in" id="lm" type="email" autocomplete="email" placeholder="ime.priimek@…"></p>
    <p><button class="btn primary" id="lb">Pošlji povezavo za prijavo</button></p>
    <p id="lmsg" class="muted" role="status"></p></div>`;
  const go = async () => {
    const email = $("#lm").value.trim(), msg = $("#lmsg");
    if (!email) { msg.textContent = "Vpiši e-mail."; return; }
    $("#lb").disabled = true; msg.textContent = "Pošiljam …";
    const { error } = await store.sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
    $("#lb").disabled = false;
    msg.textContent = error ? (error.status === 429 ? "Preveč poskusov. Počakaj nekaj minut in poskusi znova." : "Pošiljanje ni uspelo: " + error.message)
      : "Preveri e-pošto in klikni povezavo. Sporočilo lahko pride tudi v mapo neželene pošte.";
  };
  $("#lb").addEventListener("click", go);
  $("#lm").addEventListener("keydown", e => { if (e.key === "Enter") go(); });
}

/* ===================================================================== */
const STATUSI = [["razvoj","v razvoju"],["izdelano","izdelano"],["testirano","testirano"],["avto","v avtu"],["opusceno","opuščeno"]];
const statusLabel = k => (STATUSI.find(s => s[0] === k) || [k, k || "—"])[1];

const TABS = [["pregled","Pregled"],["konektorji","Konektorji in pinout"],["can","CAN in firmware"],
  ["led","LED in testne točke"],["test","Testiranje"],["spremembe","Spremembe"]];
const SECTION_OF = { odgovorna:"pregled", lokacija:"pregled", kosov:"pregled", altium:"pregled", firmwareGit:"pregled",
  namen:"pregled", specs:"pregled", zascite:"pregled", meh:"pregled", konektorji:"konektorji", mcu:"can",
  fwVer:"can", stlink:"can", term:"can", can:"can", leds:"led", tps:"led", koraki:"test", testi:"test" };

const COLS = {
  specs:[["param","Parameter"],["min","Min"],["nom","Nazivno"],["max","Max"],["enota","Enota"],["opomba","Opomba"]],
  pins:[["pin","Pin"],["signal","Signal"],["smer","Smer"],["napetost","Napetost"],["tok","Maks. tok"],["kam","Kam gre (kabelski snop)"]],
  can:[["cid","ID"],["ime","Ime"],["smer","Smer"],["vsebina","Vsebina"]],
  leds:[["led","LED"],["barva","Barva"],["sveti","Sveti"],["utripa","Utripa"],["ne","Ne sveti"]],
  tps:[["tp","TP"],["signal","Signal"],["vrednost","Pričakovana vrednost"],["tol","Toleranca"],["opomba","Opomba"]],
  testi:[["datum","Datum"],["sn","Kos (S/N)"],["korak","Korak"],["prick","Pričakovano"],["izm","Izmerjeno"],["rez","OK/NOK"],["tester","Tester"]],
};

const BRINGUP = [
  ["Vizualni pregled","Brez napajanja: mostički spajke, orientacija diod, elektrolitov in IC-jev, manjkajoči deli."],
  ["Upornost railov proti GND","Brez napajanja, vsak rail z multimetrom, da ujameš kratek stik."],
  ["Prvi vklop","Laboratorijski napajalnik z nastavljeno tokovno omejitvijo. Zapiši tok v mirovanju."],
  ["Meritev railov","Na vseh testnih točkah iz zavihka LED in testne točke."],
  ["Programiranje MCU","Preveri, da firmware teče (LED, CAN heartbeat)."],
  ["Funkcionalni testi","Vsaka funkcija vezja vsaj en test."],

const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
function setPath(o, p, v) { const ks = p.split("."); let a = o; for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; } a[ks[ks.length - 1]] = v; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }

function revsOf(vid) {
  return [...state.revs.entries()].filter(([, r]) => r.vezjeId === vid)
    .sort((a, b) => String(b[1].created || "").localeCompare(String(a[1].created || "")));
}
const latestOf = vid => revsOf(vid)[0] || null;

// trenutni pogled: {vz, rev}; pri urejanju osnutek
function cur() {
  if (state.editing) return state.draft;

}

/* ---------- gradniki ---------- */
function field(label, path, opt = {}) {
  const val = getPath(cur(), path) ?? "";
  const cls = "f" + (opt.wide ? " wide" : "");
  if (!state.editing) {
    let shown = opt.options ? (opt.options.find(o => o[0] === val) || [val, val])[1] : val;
    if (opt.link && /^https?:\/\//.test(val)) shown = `<a href="${esc(val)}" target="_blank" rel="noopener">${esc(val)}</a>`;
    else shown = shown ? esc(shown) : `<span class="empty-val">ni vpisano</span>`;
    return `<div class="${cls}"><label>${esc(label)}</label><div class="val">${shown}</div></div>`;
  }
  const id = "f_" + path.replace(/\./g, "_");
  let input;
  if (opt.options) input = `<select class="in" id="${id}" data-path="${path}">${opt.options.map(o => `<option value="${esc(o[0])}"${o[0] === val ? " selected" : ""}>${esc(o[1])}</option>`).join("")}</select>`;
  else if (opt.area) input = `<textarea class="in" id="${id}" data-path="${path}" placeholder="${esc(opt.ph || "")}">${esc(val)}</textarea>`;
  else input = `<input class="in" id="${id}" data-path="${path}" value="${esc(val)}" placeholder="${esc(opt.ph || "")}">`;
  return `<div class="${cls}"><label for="${id}">${esc(label)}</label>${input}</div>`;
}

function table(path, cols, opt = {}) {
  const rows = getPath(cur(), path) || [];
  if (!state.editing) {
    if (!rows.length) return `<p class="empty-val">${esc(opt.empty || "Ni vpisov.")}</p>`;
    return `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c[1])}</th>`).join("")}</tr></thead><tbody>${
      rows.map(r => `<tr>${cols.map(c => { const x = r[c[0]] ?? "";
        if (c[0] === "rez") return `<td class="${/^ok$/i.test(x) ? "ok" : /nok/i.test(x) ? "nok" : ""}">${esc(x)}</td>`;
        return `<td>${esc(x)}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c[1])}</th>`).join("")}<th></th></tr></thead><tbody>${
    rows.map((r, i) => `<tr>${cols.map(c => `<td><input class="in" aria-label="${esc(c[1])}" data-path="${path}.${i}.${c[0]}" value="${esc(r[c[0]] ?? "")}"></td>`).join("")}
      <td class="act"><button class="btn small" data-act="delrow" data-path="${path}" data-i="${i}">Odstrani</button></td></tr>`).join("")
  }</tbody></table></div><button class="btn small addrow" data-act="addrow" data-path="${path}" data-cols="${cols.map(c => c[0]).join(",")}">Dodaj vrstico</button>`;
}

function imageSlot(label, key) {
  const id = getPath(cur(), D + "slike." + key);

  h += id ? `<img src="${esc(store.imageUrl(id))}" alt="${esc(label)}">` : `<p class="empty-val" style="margin:0">Slika še ni dodana.</p>`;

const SCALARS = [["odgovorna","Odgovorna oseba"],["lokacija","Lokacija v avtu"],["kosov","Izdelanih kosov"],["altium","Altium shema"],
  ["firmwareGit","Firmware (Git)"],["namen","Opis delovanja"],["zascite","Zaščite"],["mcu","Mikrokontroler"],["stlink","ST-Link na vezju"],
  ["fwVer","Verzija firmwarea"],["term","120 Ω terminacija"],["meh.dim","Dimenzije"],["meh.deb","Debelina PCB"],["meh.montaza","Montaža"],
  ["meh.ohisje","Ohišje"],["meh.masa","Masa"],["meh.step","STEP model"]];
const TABLES = [["specs","Električne specifikacije"],["can","CAN sporočila"],["leds","LED indikatorji"],["tps","Testne točke"]];
function diffData(a, b) {
  const out = [], same = (x, y) => JSON.stringify(x ?? "") === JSON.stringify(y ?? "");
  const short = v => { v = String(v ?? ""); return v.length > 40 ? null : (v || "prazno"); };
  for (const [p, l] of SCALARS) {
    const x = getPath(a, p), y = getPath(b, p);
    if (!same(x, y)) { const sx = short(x), sy = short(y); out.push(sx && sy ? `${l}: ${sx} → ${sy}` : `${l}: spremenjeno`); }
  }
  for (const [p, l] of TABLES) if (!same(a[p], b[p])) out.push(`${l}: spremenjeno`);
  const ka = new Map((a.konektorji || []).map(k => [k.oznaka || "?", k])), kb = new Map((b.konektorji || []).map(k => [k.oznaka || "?", k]));
  for (const [o, k] of kb) { if (!ka.has(o)) out.push(`Dodan konektor ${o}`); else if (!same(ka.get(o), k)) out.push(`Konektor ${o}: spremenjen tip ali pinout`); }
  for (const o of ka.keys()) if (!kb.has(o)) out.push(`Odstranjen konektor ${o}`);
  if (!same(a.slike?.konektorji, b.slike?.konektorji)) out.push("Nova fotografija konektorjev");
  return out;
}

/* ---------- seznam ---------- */
function findHits(vid, q) {
  const vz = state.vezja.get(vid), lr = latestOf(vid);
  const hits = [];
  if ((vz.kratica + " " + vz.ime).toLowerCase().includes(q)) return [{ where: "", text: "", tab: "" }];
  if (!lr) return [];
  const walk = (o, path) => {
    if (hits.length >= 2 || o == null) return;
    if (typeof o === "string") { if (o.toLowerCase().includes(q)) hits.push({ path, text: o }); return; }
    if (Array.isArray(o)) o.forEach((x, i) => walk(x, path.concat(i)));
    else if (typeof o === "object") for (const k in o) if (k !== "slike") walk(o[k], path.concat(k));
  };
  walk(lr[1].data || {}, []);
  return hits.map(h => {
    const tab = TABS.find(t => t[0] === SECTION_OF[h.path[0]]);
    let where = tab ? tab[1] : "";
    if (h.path[0] === "konektorji") { const k = lr[1].data.konektorji[h.path[1]]; if (k && k.oznaka) where += " " + k.oznaka; }
    return { where, text: h.text.length > 50 ? h.text.slice(0, 50) + "…" : h.text, tab: tab ? tab[0] : "" };
  });
}
const sortedVezja = () => [...state.vezja.entries()].sort((a, b) => (a[1].kratica || "").localeCompare(b[1].kratica || "", "sl"));

function renderList() {
  const q = state.q.trim().toLowerCase();
  let html = "", shown = 0;
  if (state.editing && !state.draft.vid) html += `<button class="item" aria-current="true"><div class="row1"><span class="kr">${esc(state.draft.vz.kratica || "Novo vezje")}</span></div><div class="nm">še ni shranjeno</div></button>`;
  for (const [id, v] of sortedVezja()) {
    let hits = [];
    if (q) { hits = findHits(id, q); if (!hits.length) continue; }
    shown++;
    const lr = latestOf(id);
    html += `<button class="item" data-sel="${esc(id)}" data-tab="${esc(hits[0]?.tab || "")}" aria-current="${id === state.vid}">
      <div class="row1"><span class="kr">${esc(v.kratica || "brez kratice")}</span>${lr ? `<span class="chip st-${esc(lr[1].status)}">${esc(statusLabel(lr[1].status))}</span><span class="rv">${esc(lr[1].rev)}</span>` : ""}</div>
      <div class="nm">${esc(v.ime)}</div>
      ${hits.filter(h => h.where).map(h => `<div class="hit">${esc(h.where)}: ${esc(h.text)}</div>`).join("")}
    </button>`;
  }
  if (q && !shown) html += `<p class="muted" style="padding:10px 18px">Nobeno vezje ne vsebuje „${esc(state.q)}“.</p>`;
  if (!q && !state.vezja.size && state.loadedV && !state.editing) html += `<p class="muted" style="padding:10px 18px">Seznam je prazen.</p>`;
  $("#list").innerHTML = html;
}

      ${d.length ? `<ul class="diff">${d.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="empty-val">Podatki so enaki kot v ${esc(prev.rev)}.</p>`}`;
  }
  return h;
}

const TAB_FN = { pregled:tabPregled, konektorji:tabKonektorji, can:tabCan, led:tabLed, test:tabTest, spremembe:tabSpremembe };

function revStrip(c) {
  if (state.editing) {
    const d = state.draft;
    return `<div class="revstrip"><span class="muted">Revizija:</span><span class="rpill" aria-current="true">${esc(d.rev.rev || "nova")}${d.rid ? "" : " (nova)"}</span></div>`;
  }
  const list = revsOf(state.vid);

    ${state.canWrite ? `<button class="btn small" data-act="newrev">Nova revizija</button>` : ""}</div>`;

function renderDetail() {

    return;
  }
  app.classList.add("show-detail");
  let h = `<div class="detail">`;
  if (!c.rev) {
    h += `<div class="topbar"><button class="btn back" data-act="back">Seznam</button><h2 style="margin:0">${esc(c.vz.kratica)}</h2></div>
      <p>To vezje še nima nobene revizije.</p>${state.canWrite ? `<button class="btn primary" data-act="newrev">Dodaj prvo revizijo</button>` : ""}</div>`;

  }

    h += `<div class="editbar"><strong>${d.rid ? "Urejanje" : "Nova revizija"}${d.vz.kratica ? " – " + esc(d.vz.kratica) : ""}</strong><span style="flex:1"></span>
      ${d.rid && revsOf(d.vid).length > 1 ? `<button class="btn danger" data-act="delrev">Izbriši revizijo</button>` : ""}
      ${d.vid && d.rid ? `<button class="btn danger" data-act="delvez">Izbriši vezje</button>` : ""}
      <button class="btn" data-act="cancel">Prekliči</button>
      <button class="btn primary" data-act="save"${state.saving ? " disabled" : ""}>${state.saving ? "Shranjujem …" : "Shrani"}</button></div>`;
    if (!d.rid && d.prevRid) h += `<div class="banner">Nova revizija je kopija revizije ${esc(state.revs.get(d.prevRid)?.rev)}. Popravi, kar se je spremenilo, in v zavihku Spremembe opiši spremembe. Kljukice pri testiranju so ponastavljene.</div>`;
    if (state.remoteChanged) h += `<div class="banner">To revizijo je medtem shranil nekdo drug. Če zdaj shraniš, prepišeš njegove spremembe.</div>`;
  } else {
    const latest = latestOf(state.vid);
    h += `<div class="topbar"><button class="btn back" data-act="back">Seznam</button><span class="spacer"></span>
      ${state.canWrite ? `<button class="btn primary" data-act="edit">Uredi ${esc(c.rev.rev)}</button>` : ""}</div>`;
    if (latest && latest[0] !== state.rid) h += `<div class="banner">Gledaš starejšo revizijo ${esc(c.rev.rev)}. Zadnja je ${esc(latest[1].rev)}.</div>`;
  }
  h += revStrip(c);
  h += `<div class="tabs" role="tablist">${TABS.map(t => `<button class="tab" role="tab" data-tabbtn="${t[0]}" aria-selected="${t[0] === state.tab}">${esc(t[1])}</button>`).join("")}</div>`;
  h += `<section role="tabpanel">${TAB_FN[state.tab](c)}</section></div>`;
  const scroll = main.scrollTop; main.innerHTML = h; main.scrollTop = scroll;
}

function modal({ title, text = "", input = false, value = "", placeholder = "", ok = "Potrdi", danger = false }) {
  return new Promise(resolve => {
    const wrap = document.createElement("div");
    wrap.className = "modal-back";
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
      <h2 id="mt">${esc(title)}</h2>${text ? `<p>${esc(text)}</p>` : ""}
      ${input ? `<input class="in" id="mi" value="${esc(value)}" placeholder="${esc(placeholder)}">` : ""}
      <p class="merr" hidden></p>
      <div class="mbtns"><button class="btn" data-m="no">Prekliči</button><button class="btn ${danger ? "danger" : "primary"}" data-m="ok">${esc(ok)}</button></div></div>`;
    const prev = document.activeElement;
    document.body.appendChild(wrap);
    const inp = wrap.querySelector("#mi");
    (inp || wrap.querySelector('[data-m="ok"]')).focus();
    const done = v => { wrap.remove(); prev && prev.focus && prev.focus(); resolve(v); };
    const accept = () => {
      if (input) { const v = inp.value.trim(); if (!v) { const e = wrap.querySelector(".merr"); e.textContent = "Vpiši oznako."; e.hidden = false; inp.focus(); return; } done(v); }
      else done(true);
    };
    wrap.addEventListener("click", e => { const m = e.target.dataset.m; if (m === "ok") accept(); else if (m === "no" || e.target === wrap) done(input ? null : false); });
    wrap.addEventListener("keydown", e => { if (e.key === "Escape") done(input ? null : false); else if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); accept(); } });
  });
}
const ask = (title, text, ok = "Potrdi", danger = false) => modal({ title, text, ok, danger });

function blobToDataUrl(b) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
function dataUrlToBlob(u) { const [h, d] = u.split(","); const type = h.match(/data:([^;]+)/)[1]; const bin = atob(d); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type }); }

/* ---------- dejanja ---------- */
function openEdit(draft) {
  state.draft = draft; state.editing = true; state.remoteChanged = false;
  renderList(); renderDetail();
}
function stopEdit() { state.editing = false; state.draft = null; state.remoteChanged = false; renderList(); renderDetail(); }
async function confirmLeave() { return !state.editing || await ask("Zapustiš urejanje?", "Neshranjene spremembe se bodo izgubile.", "Zapusti brez shranjevanja", true); }

async function startNewRevision() {
  const vz = state.vezja.get(state.vid);
  const latest = latestOf(state.vid);
  const label = await modal({ title: latest ? "Nova revizija" : "Prva revizija", text: latest ? `Nova revizija bo kopija revizije ${latest[1].rev}. Vpiši njeno oznako.` : "Vpiši oznako prve revizije.", input: true, placeholder: "npr. 2027 v2", ok: "Ustvari revizijo" });
  if (!label) return;
  const data = latest ? structuredClone(latest[1].data) : emptyData();
  // nova revizija = nov fizični kos: testiranje od začetka
  data.koraki = (data.koraki && data.koraki.length ? data.koraki : freshSteps()).map(k => ({ ...k, done: false, opomba: "" }));
  data.testi = [];
  openEdit({ vid: state.vid, rid: null, prevRid: latest ? latest[0] : null, baseStamp: null,
    vz: structuredClone(vz), rev: { rev: label.trim(), status: "razvoj", datum: "", avtor: "", spremembe: "", errata: "", data } });
  state.tab = latest ? "spremembe" : "pregled"; renderDetail();
}

async function save() {
  if (state.saving) return;
  const d = state.draft;
  if (!d.vz.kratica.trim()) { toast("Vpiši kratico vezja."); state.tab = "pregled"; renderDetail(); $("#tb_kr")?.focus(); return; }
  if (!d.rev.rev.trim()) { toast("Vpiši oznako revizije."); state.tab = "pregled"; renderDetail(); return; }
  if (!d.rid && d.prevRid && !d.rev.spremembe.trim()) { toast("Opiši, kaj se je spremenilo glede na prejšnjo revizijo."); state.tab = "spremembe"; renderDetail(); $("#f_rev_spremembe")?.focus(); return; }
  state.saving = true; renderDetail();
  try {
    const me = await store.myId(), now = new Date().toISOString();
    const vid = d.vid || store.newId("vezja");
    const oldVz = state.vezja.get(vid);
    if (!oldVz || oldVz.kratica !== d.vz.kratica || oldVz.ime !== d.vz.ime)
      await store.save("vezja", vid, { kratica: d.vz.kratica.trim(), ime: d.vz.ime || "", createdAt: oldVz?.createdAt || now });
    const rid = d.rid || store.newId("revizije");
    const old = state.revs.get(rid);
    await store.save("revizije", rid, { ...d.rev, vezjeId: vid, created: old?.created || now, updatedAt: now, updatedBy: me });
    state.vid = vid; state.rid = rid; state.saving = false;
    stopEdit(); toast("Shranjeno.");
  } catch (e) {
    state.saving = false; renderDetail();
    if (e && e.code === "invalid_argument") { state.canWrite = false; toast("Nimaš pravic za urejanje."); stopEdit(); renderSideFoot(); }
    else if (e && e.code === "quota_exceeded") toast("Baza je polna. Zbriši kakšno staro revizijo ali sliko.");
    else toast("Shranjevanje ni uspelo. Poskusi znova čez nekaj sekund.");
  }
}

// kljukice in opombe pri testiranju se shranijo takoj (brez urejanja)
let stepWrite = Promise.resolve();
function saveSteps(mutate) {
  const r = state.revs.get(state.rid); if (!r) return;
  const koraki = structuredClone(r.data.koraki || []); mutate(koraki);
  r.data.koraki = koraki;
  stepWrite = stepWrite.then(() => store.update("revizije", state.rid, { data: { koraki } }))
    .catch(e => { toast(e && e.code === "invalid_argument" ? "Nimaš pravic za urejanje." : "Shranjevanje ni uspelo."); });
}

function selectVezje(vid, tab) {
  state.vid = vid; state.rid = latestOf(vid)?.[0] || null;
  if (tab) state.tab = tab;
  renderList(); renderDetail(); $("#main").scrollTop = 0;
}

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act],[data-sel],[data-tabbtn],[data-rev]");
  if (!b) return;
  if (b.dataset.sel) { if (!(await confirmLeave())) return; state.editing = false; state.draft = null; selectVezje(b.dataset.sel, b.dataset.tab); return; }
  if (b.dataset.rev) { state.rid = b.dataset.rev; renderDetail(); return; }
  if (b.dataset.tabbtn) { state.tab = b.dataset.tabbtn; renderDetail(); return; }
  const act = b.dataset.act, d = state.draft;
  if (act === "help") { openHelp(); return; }
  if (act === "logout") { await store.logout(); location.reload(); return; }
  if (act === "dellogo") { try { await store.saveSettings({ ...state.settings, logo: "" }); } catch { toast("Logotipa ni bilo mogoče odstraniti."); } return; }
  if (act === "new") {
    if (!(await confirmLeave())) return;
    openEdit({ vid: null, rid: null, prevRid: null, baseStamp: null, vz: { kratica: "", ime: "" },
      rev: { rev: "", status: "razvoj", datum: "", avtor: "", spremembe: "", errata: "", data: emptyData() } });
    state.tab = "pregled"; renderDetail(); $("#tb_kr")?.focus();
  }
  else if (act === "edit") {
    const r = state.revs.get(state.rid), vz = state.vezja.get(state.vid);
    const list = revsOf(state.vid), i = list.findIndex(([id]) => id === state.rid);
    openEdit({ vid: state.vid, rid: state.rid, prevRid: list[i + 1]?.[0] || null, baseStamp: r.updatedAt || null, vz: structuredClone(vz), rev: structuredClone(r) });
  }
  else if (act === "newrev") { if (await confirmLeave()) { state.editing = false; state.draft = null; await startNewRevision(); } }
  else if (act === "cancel") stopEdit();
  else if (act === "save") save();
  else if (act === "back") { state.vid = null; state.rid = null; $("#app").classList.remove("show-detail"); renderList(); }
  else if (act === "delrev") {
    if (!(await ask(`Izbrišem revizijo ${d.rev.rev}?`, "Tega ni mogoče razveljaviti.", "Izbriši revizijo", true))) return;
    try { await store.remove("revizije", d.rid); state.rid = null; stopEdit(); state.rid = latestOf(state.vid)?.[0] || null; renderDetail(); toast("Revizija izbrisana."); }
    catch { toast("Brisanje ni uspelo."); }
  }
  else if (act === "delvez") {
    const n = revsOf(d.vid).length;
    if (!(await ask(`Izbrišem vezje ${d.vz.kratica}?`, `Izbrisane bodo tudi vse njegove revizije (${n}). Tega ni mogoče razveljaviti.`, "Izbriši vezje", true))) return;
    try { for (const [id] of revsOf(d.vid)) await store.remove("revizije", id); await store.remove("vezja", d.vid);
      state.vid = null; state.rid = null; stopEdit(); toast("Vezje izbrisano."); }
    catch { toast("Brisanje ni uspelo."); }
  }
  else if (act === "addrow") {
    const arr = getPath(d, b.dataset.path) || []; const row = {}; b.dataset.cols.split(",").forEach(c => row[c] = "");
    arr.push(row); setPath(d, b.dataset.path, arr); renderDetail();
  }
  else if (act === "delrow") { getPath(d, b.dataset.path).splice(+b.dataset.i, 1); renderDetail(); }
  else if (act === "addkon") { d.rev.data.konektorji.push(newKonektor()); renderDetail(); }
  else if (act === "addstep") { (d.rev.data.koraki ||= []).push({ naziv: "", opis: "", done: false, opomba: "" }); renderDetail(); }
  else if (act === "delimg") { d.rev.data.slike[b.dataset.key] = ""; renderDetail(); }
  else if (act === "export") {
    const out = { verzija: 3, vezja: sortedVezja().map(([id, v]) => ({ id, ...v })), revizije: [...state.revs.entries()].map(([id, r]) => ({ id, ...r })), slike: {} };
    const ids = [...new Set(out.revizije.map(r => r.data?.slike?.konektorji).filter(Boolean))];
    let fail = 0;
    if (ids.length) toast(`Pripravljam ${ids.length} slik …`);
    for (const id of ids) { try { out.slike[id] = await blobToDataUrl(await store.readImage(id)); } catch { fail++; } }
    try { await store.download(`vezja-izvoz-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(out, null, 2)); if (fail) toast(`Izvoženo, ${fail} slik ni bilo mogoče prebrati.`); }
    catch (e) { if (e && e.code !== "declined") toast("Izvoz ni uspel."); }
  }

});

document.addEventListener("input", ev => {
  const t = ev.target, p = t.dataset && t.dataset.path;
  if (p && state.editing) { setPath(state.draft, p, t.value); if (p === "vz.kratica" && !state.draft.vid) renderList(); }

  if (t.dataset && t.dataset.path && state.editing && t.tagName === "SELECT") setPath(state.draft, t.dataset.path, t.value);

  }
  if (t.hasAttribute && t.hasAttribute("data-import") && t.files[0]) {
    try {
      const data = JSON.parse(await t.files[0].text());
      if (!Array.isArray(data.vezja) || !Array.isArray(data.revizije)) throw new Error();
      if (!(await ask("Uvozim podatke?", `${data.vezja.length} vezij in ${data.revizije.length} revizij. Zapisi z enakim ID-jem bodo prepisani.`, "Uvozi"))) { t.value = ""; return; }
      const map = {};
      for (const [oldId, url] of Object.entries(data.slike || {})) { try { map[oldId] = await store.upload(dataUrlToBlob(url)); } catch {} }
      for (const { id, ...rest } of data.vezja) await store.save("vezja", id, rest);
      for (const { id, ...rest } of data.revizije) {
        const k = rest.data?.slike?.konektorji;
        if (k) rest.data.slike.konektorji = map[k] || (data.slike && data.slike[k] ? "" : k);
        await store.save("revizije", id, rest);
      }
      toast("Uvoz končan.");
    } catch { toast("Datoteke ni mogoče uvoziti. Pričakujem JSON iz gumba Izvozi vse."); }
    t.value = "";
  }
});

/* ---------- prenos podatkov iz prve verzije prototipa ---------- */
async function migrateOld() {
  if (state.migrated || !state.canWrite || !state.loadedV || !state.loadedR) return;
  state.migrated = true;
  for (const [vid, v] of state.vezja) {
    if (!("specs" in v) || revsOf(vid).length) continue;
    const data = emptyData();
    for (const k of Object.keys(data)) if (k in v && k !== "koraki") data[k] = v[k];
    if (v.meh) data.meh = { ...data.meh, ...v.meh };
    data.slike = { konektorji: v.slike?.konektorji || "" };
    try {
      await store.save("revizije", store.newId("revizije"), { vezjeId: vid, rev: v.revizija || "v1", status: v.status || "razvoj",
        datum: "", avtor: "", spremembe: "Prenos iz prve verzije aplikacije", errata: "", data, created: v.updatedAt || new Date().toISOString(),
        updatedAt: new Date().toISOString(), updatedBy: await store.myId() });
      await store.save("vezja", vid, { kratica: v.kratica || "", ime: v.ime || "", createdAt: v.updatedAt || new Date().toISOString() });
    } catch {}
  }
}

/* ---------- zagon ---------- */
async function resolveNames() {
  const ids = [...new Set([...state.revs.values()].map(r => r.updatedBy).filter(Boolean))];
  if (!ids.length) return;
  state.names = await store.names(ids);
  if (!state.editing && state.tab === "spremembe") renderDetail();
}
function onData() {
  if (state.editing && state.draft.rid) {
    const nr = state.revs.get(state.draft.rid);
    if (!nr || (nr.updatedAt || null) !== state.draft.baseStamp) state.remoteChanged = true;
  }
  if (state.vid && !state.vezja.has(state.vid) && !state.editing) { state.vid = null; state.rid = null; }
  if (state.vid && (!state.rid || !state.revs.has(state.rid))) state.rid = latestOf(state.vid)?.[0] || null;
  renderList();
  const focused = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.stepnote !== undefined;
  if ((!state.editing || state.remoteChanged) && !focused) renderDetail();
  resolveNames(); migrateOld();
}

(async function start() {
  renderList(); renderSideFoot();
  const ok = await store.init();
  if (ok === "login") return;
  if (!ok) { state.canWrite = false; renderSideFoot(); renderDetail(); return; }
  state.canWrite = (await store.canWrite()) !== false;
  renderSideFoot();
  const onErr = err => { if (err.code === "revoked") { state.error = "Dostop do te aplikacije ni več na voljo."; renderDetail(); } else toast("Povezava z bazo je prekinjena. Osveži stran."); };
  store.watchSettings(st => { state.settings = st || {}; renderLogo(); });
  store.subscribe("vezja", list => { state.vezja = new Map(list.map(({ id, ...v }) => [id, v])); state.loadedV = true; onData(); }, onErr);
  store.subscribe("revizije", list => { state.revs = new Map(list.map(({ id, ...v }) => [id, v])); state.loadedR = true; onData(); }, onErr);
})();

</script>
